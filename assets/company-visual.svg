<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 530" role="img" aria-labelledby="title desc">
  <title id="title">Business project connection</title><desc id="desc">A project brief connects a company team with a young contributor and a finished deliverable.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ef"/><stop offset="1" stop-color="#e8f1d9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#173c32" flood-opacity=".12"/></filter>
  </defs>
  <ellipse cx="310" cy="464" rx="220" ry="24" fill="#d8e4d5" opacity=".55"/>
  <circle cx="300" cy="255" r="208" fill="url(#panel)"/>
  <circle cx="300" cy="255" r="174" fill="none" stroke="#c9d9c7" stroke-dasharray="5 10"/>
  <path d="M93 152c24-42 63-72 105-88" fill="none" stroke="#d5f16d" stroke-width="16" stroke-linecap="round"/>
  <path d="M431 387c27-17 48-40 63-67" fill="none" stroke="#b1ca82" stroke-width="12" stroke-linecap="round"/>
  <!-- Company panel -->
  <g filter="url(#shadow)" transform="translate(57 151)">
    <rect width="153" height="162" rx="12" fill="#fff"/>
    <rect width="153" height="36" rx="12" fill="#173c32"/><path d="M0 24h153v12H0z" fill="#173c32"/>
    <circle cx="16" cy="18" r="3" fill="#d5f16d"/><circle cx="28" cy="18" r="3" fill="#c3d3c9"/><circle cx="40" cy="18" r="3" fill="#c3d3c9"/>
    <rect x="17" y="55" width="50" height="8" rx="4" fill="#1e7455"/><rect x="17" y="72" width="112" height="5" rx="2.5" fill="#e0e8df"/><rect x="17" y="84" width="94" height="5" rx="2.5" fill="#e0e8df"/>
    <rect x="17" y="107" width="119" height="36" rx="5" fill="#edf4d8"/><path d="M31 126h28m-14-9v18" stroke="#1e7455" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="130" font-family="Arial,sans-serif" font-size="8" fill="#536b5b">PROJECT BRIEF</text>
  </g>
  <!-- Connecting track -->
  <path d="M218 237c41-34 65-38 92-22s45 28 88 0" fill="none" stroke="#8fb29b" stroke-width="3" stroke-dasharray="5 8"/>
  <circle cx="223" cy="233" r="7" fill="#d5f16d" stroke="#fff" stroke-width="3"/><circle cx="397" cy="215" r="7" fill="#d5f16d" stroke="#fff" stroke-width="3"/>
  <!-- Main project workspace -->
  <g filter="url(#shadow)" transform="translate(224 85)">
    <rect width="230" height="178" rx="16" fill="#fff"/>
    <rect width="230" height="32" rx="16" fill="#f1f5e9"/><path d="M0 20h230v12H0z" fill="#f1f5e9"/>
    <circle cx="18" cy="16" r="3.5" fill="#d5f16d"/><text x="30" y="20" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#64766a">YOUR PROJECT SPACE</text>
    <rect x="17" y="49" width="95" height="9" rx="4.5" fill="#173c32"/><rect x="17" y="66" width="162" height="5" rx="2.5" fill="#e2e9e0"/><rect x="17" y="78" width="141" height="5" rx="2.5" fill="#e2e9e0"/>
    <rect x="17" y="101" width="196" height="53" rx="7" fill="#f4f8e8"/>
    <rect x="28" y="112" width="34" height="31" rx="4" fill="#d5f16d"/><path d="M36 133l8-9 7 6 5-7" fill="none" stroke="#173c32" stroke-width="2" stroke-linecap="round"/>
    <rect x="73" y="113" width="91" height="5" rx="2.5" fill="#8ca394"/><rect x="73" y="125" width="113" height="5" rx="2.5" fill="#c9d8cb"/><rect x="73" y="137" width="74" height="5" rx="2.5" fill="#c9d8cb"/>
  </g>
  <!-- Teen contributor -->
  <g transform="translate(392 249)">
    <path d="M30 163c7-48 31-70 70-70s62 21 70 70" fill="#1e7455"/>
    <path d="M66 104l34 28 36-28 18 59H47z" fill="#d5f16d"/>
    <rect x="87" y="74" width="28" height="29" rx="12" fill="#d99d77"/>
    <ellipse cx="101" cy="47" rx="40" ry="44" fill="#e7b18b"/>
    <path d="M62 49c-5-38 16-57 43-57 31 0 46 21 39 56-9-12-19-21-38-22-17-1-28 7-44 23z" fill="#273b32"/>
    <path d="M79 53h8m27 0h8" stroke="#35483c" stroke-width="3" stroke-linecap="round"/><path d="M91 70c7 5 14 5 21 0" fill="none" stroke="#a55d49" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M78 91l23 24 24-24" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M42 153l-24 22m139-22 23 22" stroke="#d99d77" stroke-width="13" stroke-linecap="round"/>
    <path d="M54 166h103" stroke="#173c32" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- Completion badge -->
  <g filter="url(#shadow)" transform="translate(397 51)">
    <rect width="118" height="58" rx="9" fill="#173c32"/>
    <circle cx="26" cy="29" r="14" fill="#d5f16d"/><path d="m19 29 5 5 9-11" fill="none" stroke="#173c32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="25" font-family="Arial,sans-serif" font-size="8" fill="#aec2b4">DELIVERABLE</text><text x="49" y="38" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">SUBMITTED</text>
  </g>
  <g fill="#1e7455"><circle cx="104" cy="92" r="5"/><circle cx="523" cy="318" r="4"/><circle cx="190" cy="397" r="4"/></g>
  <g fill="#d5f16d"><path d="m493 138 5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path d="m137 348 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
